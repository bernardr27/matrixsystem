name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Run tests (safe mode)
        env:
          NEXT_PUBLIC_SAFE_MODE: 'true'
          NEXT_PUBLIC_AI_BASE_URL: ''
          NEXT_PUBLIC_AI_MODEL_ID: 'ci-model'
        run: npm test
