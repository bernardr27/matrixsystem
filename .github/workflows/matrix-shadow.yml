name: Matrix Shadow (Cloud Bridge)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'heartbeat'
        type: choice
        options:
          - heartbeat
          - build
          - deploy
          - troubleshoot

jobs:
  cloud-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: matrix-shadow-cloud-bridge
      cancel-in-progress: true
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MATRIX_MODE: production
      MATRIX_ENVIRONMENT: cloud
      MATRIX_CLOUD_MODE: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Execute Cloud Action
        run: |
          ACTION="${{ github.event.inputs.action || 'heartbeat' }}"
          echo "matrix-shadow action=${ACTION}"
          case "$ACTION" in
            heartbeat) npm run diag:heartbeat -- --limit=8 || true ;;
            build) npm run build:turbo || true ;;
            deploy) npm run cloud:preflight -- --skip-github || true ;;
            troubleshoot) npm run diag:bridge -- --limit=25 || true ;;
            *) echo "Unknown action: ${ACTION}" && exit 1 ;;
          esac

      - name: Bridge Audit Snapshot
        if: always()
        run: npm run diag:bridge -- --limit=20 || true
