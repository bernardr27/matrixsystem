name: Matrix Turbo CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

concurrency:
  group: matrix-turbo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Type, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Restore Turbo Local Cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/*/.turbo
            libs/*/.turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Turbo Lint
        run: npm run lint:turbo

      - name: Turbo Type Check
        run: npm run type-check:turbo

      - name: Turbo Test
        run: npm run test:turbo

      - name: Turbo Build
        run: npm run build:turbo
