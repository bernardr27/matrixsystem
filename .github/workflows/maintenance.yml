name: Scheduled Maintenance

on:
  schedule:
    - cron: '0 3 * * 0' # weekly on Sunday 03:00 UTC

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps (root)
        run: npm install --no-audit --no-fund
      - name: Run cleanup (dry-run)
        run: node ./scripts/maintenance/cleanup_organize.cjs --keep=100 --days=30

  auth-snapshot:
    runs-on: ubuntu-latest
    needs: cleanup
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run auth snapshot generator (manual secrets required)
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable
          APP: ghost
          URL: http://localhost:5173
          USERNAME: ${{ secrets.MATRIX_SNAPSHOT_USER }}
          PASSWORD: ${{ secrets.MATRIX_SNAPSHOT_PASS }}
        run: |
          echo "This job is a template — it requires a running host and secrets."
