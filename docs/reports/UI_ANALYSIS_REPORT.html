<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citadel Dashboard UI Analysis Report</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #06060f;
            color: #e8e0d4;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            color: #d4a843;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            color: #999;
            margin-bottom: 40px;
            font-size: 0.9em;
        }
        .viewport-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 168, 67, 0.1);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .viewport-title {
            color: #d4a843;
            font-size: 1.5em;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(212, 168, 67, 0.2);
            padding-bottom: 10px;
        }
        .screenshot {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid rgba(212, 168, 67, 0.2);
        }
        .checks {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .check-group {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #d4a843;
        }
        .check-group.warning {
            border-left-color: #f59e0b;
        }
        .check-group.error {
            border-left-color: #ef4444;
        }
        .check-item {
            padding: 8px 0;
            font-size: 0.95em;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-right: 10px;
        }
        .badge.pass { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge.warning { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .badge.error { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .summary-card {
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(212, 168, 67, 0.1);
        }
        .summary-card .num {
            font-size: 2em;
            color: #d4a843;
            font-weight: bold;
        }
        .summary-card .label {
            color: #999;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Citadel Dashboard UI Analysis</h1>
        <div class="subtitle">Generated: 2026-02-23T15:49:49.248Z</div>
        
        
            <div class="viewport-section">
                <div class="viewport-title">iPhone 12</div>
                
                
                    <div>
                        <img src="SCREENSHOT_iphone12_1771861779881.png" alt="iPhone 12" class="screenshot" loading="lazy">
                    </div>
                
                
                
                    <div class="summary-grid">
                        <div class="summary-card">
                            <div class="num">0</div>
                            <div class="label">✅ Passed</div>
                        </div>
                        <div class="summary-card">
                            <div class="num">0</div>
                            <div class="label">⚠️ Warnings</div>
                        </div>
                        <div class="summary-card">
                            <div class="num">1</div>
                            <div class="label">❌ Issues</div>
                        </div>
                    </div>
                    
                    <div class="checks">
                        
                        
                        
                        
                        
                            <div class="check-group error">
                                <strong>❌ Issues</strong>
                                
                                    <div class="check-item"><span class="badge error">ERROR</span>Dock is hidden</div>
                                
                            </div>
                        
                    </div>
                
                
                
            </div>
        
            <div class="viewport-section">
                <div class="viewport-title">Desktop (1440px)</div>
                
                
                    <div>
                        <img src="SCREENSHOT_desktop_1771861784905.png" alt="Desktop (1440px)" class="screenshot" loading="lazy">
                    </div>
                
                
                
                    <div class="summary-grid">
                        <div class="summary-card">
                            <div class="num">0</div>
                            <div class="label">✅ Passed</div>
                        </div>
                        <div class="summary-card">
                            <div class="num">0</div>
                            <div class="label">⚠️ Warnings</div>
                        </div>
                        <div class="summary-card">
                            <div class="num">1</div>
                            <div class="label">❌ Issues</div>
                        </div>
                    </div>
                    
                    <div class="checks">
                        
                        
                        
                        
                        
                            <div class="check-group error">
                                <strong>❌ Issues</strong>
                                
                                    <div class="check-item"><span class="badge error">ERROR</span>Dock is hidden</div>
                                
                            </div>
                        
                    </div>
                
                
                
            </div>
        
    </div>
</body>
</html>
